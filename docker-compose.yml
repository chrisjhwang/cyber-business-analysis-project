# Local dev infrastructure. Stage 1 runs Postgres only; the API service is
# added in Stage 7 (containerization), once there is an app to containerize.
services:
  db:
    image: postgres:16-alpine
    container_name: cyber_risk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cyber_risk}
    ports:
      # host:container — the host port is what DATABASE_URL points at.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Stage 7 will make the API service depend on this condition.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cyber_risk}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
