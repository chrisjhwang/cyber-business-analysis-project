# Local stack: Postgres + a one-shot migration job + the API.
#
#   docker compose up -d --build        start everything
#   docker compose run --rm api python -m app.cli pipeline
#                                        ingest live data, score, write a report
#
# Inside this network the API reaches Postgres at host "db" (the service name),
# not "localhost" -- inside a container, localhost is that container itself.
# That is why DATABASE_URL is overridden below instead of taken from .env,
# where it points at localhost for tools running on your machine.

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:16-alpine
    container_name: cyber_risk_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives `docker compose down`. `down -v` wipes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "Container started" is not "Postgres accepts connections". This probe is
      # what depends_on waits for.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app-env
    build: .
    image: cyber-risk-api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-env
    build: .
    image: cyber-risk-api
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
